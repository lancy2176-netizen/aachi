<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aachi</title>
    <script>
      const base = '/aachi/';
      const path = window.location.pathname.startsWith(base)
        ? window.location.pathname.slice(base.length).split('/').filter(Boolean).join('/')
        : '';
      const query = window.location.search;
      window.location.replace(`${base}#/${path}${query}`);
    </script>
  </head>
  <body></body>
</html>
